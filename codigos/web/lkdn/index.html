<!DOCTYPE html>
<html lang="es">
<head>
  <!--Ref: [#79](https://github.com/SidVal/SidV/issues/79) -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <title>Generador de Mensajes</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f9f9f9;
      padding: 2rem;
      max-width: 600px;
      margin: auto;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    label {
      font-weight: 600;
      margin-top: 1rem;
      display: block;
    }
    input, select, textarea, datalist {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.25rem;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    textarea {
      height: 150px;
      resize: none;
      margin-top: 1rem;
    }
    button {
      margin-top: 1rem;
      padding: 0.75rem;
      background-color: #007acc;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background-color: #005fa3;
    }
    .copiado {
      text-align: center;
      color: green;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <h1>Generador de Mensajes</h1>
  <label for="nombre">Nombre</label>
  <input type="text" id="nombre" placeholder="Ej: Alejandro" />

  <label for="servicio">Servicio</label>
  <input list="lista-servicios" id="servicio" placeholder="Ej: Consultoría Estratégica" />
  <datalist id="lista-servicios">
    <option value="Consultoría financiera">
    <option value="Asesoría fiscal">
    <option value="Asesoría financiera">
    <option value="Planificación financiera">
    <option value="Gestión de proyectos">
    <option value="Consultoría de gestión">
    <option value="Desarrollo web">
    <option value="Consultoría de TI">
  </datalist>

<label for="tipo">Tipo de mensaje</label>
<select id="tipo">
  <option value="propuesta">Propuesta inicial genérica</option>
  <option value="solicitud_clara">Solicitud clara</option>
  <option value="solicitud_rara">Solicitud rara o difusa</option>
  <option value="posible_spam">Posible spam o autopromoción</option>
  <option value="seguimiento">Seguimiento</option>
  <option value="cierre">Cierre</option>
</select>

  <label for="mensaje">Mensaje generado</label>
  <textarea id="mensaje" readonly></textarea>

  <button onclick="copiarMensaje()">Copiar mensaje</button>
  <div id="copiado" class="copiado" style="display:none;">Mensaje copiado al portapapeles</div>

  <script src="templates.js"></script>
<script>
  const nombre = document.getElementById('nombre');
  const servicio = document.getElementById('servicio');
  const tipo = document.getElementById('tipo');
  const mensaje = document.getElementById('mensaje');
  const copiado = document.getElementById('copiado');

  function slugify(text) {
    return text
      .toString()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .trim()
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '');
  }

  function actualizarMensaje() {
    const plantilla = templates[tipo.value] || '';

    const nombreValor = nombre.value.trim() || 'Cliente';
    const servicioValor = servicio.value.trim() || 'tu proyecto';
    const servicioUrl = slugify(servicioValor) || 'no-estoy-seguro';

    const texto = plantilla
      .replace(/{{nombre}}/g, nombreValor)
      .replace(/{{servicio}}/g, servicioValor)
      .replace(/{{servicio_url}}/g, servicioUrl);

    mensaje.value = texto;
  }

  async function copiarMensaje() {
    try {
      await navigator.clipboard.writeText(mensaje.value);
    } catch (error) {
      mensaje.select();
      document.execCommand('copy');
    }

    copiado.style.display = 'block';
    setTimeout(() => copiado.style.display = 'none', 2000);
  }

  nombre.addEventListener('input', actualizarMensaje);
  servicio.addEventListener('input', actualizarMensaje);
  tipo.addEventListener('change', actualizarMensaje);

  actualizarMensaje();
</script>
</body>
</html>
