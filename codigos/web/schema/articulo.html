<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador Avanzado de Schema para Contenido</title>
  <!-- Tailwind CSS v4 CDN -->
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 p-6">

  <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-md p-8 border border-slate-100">
    <div class="mb-6">
      <h1 class="text-2xl font-bold text-slate-900">Configuración de Contenido (Schema.org)</h1>
      <p class="text-sm text-slate-500 mt-1">Estructura indexable adaptada para motores de búsqueda y respuestas de IA.</p>
    </div>

    <!-- Formulario de Artículo Avanzado -->
    <form id="articleForm" class="space-y-5">
      
      <!-- Selector de Tipo de Contenido -->
      <div>
        <label for="contentType" class="block text-sm font-semibold text-slate-700 mb-1">Tipo de Contenido</label>
        <select id="contentType" name="contentType" 
                class="w-full px-4 py-2 border border-slate-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm cursor-pointer">
          <option value="BlogPosting">Artículo de Blog Estándar (BlogPosting)</option>
          <option value="TechArticle">Guía o Tutorial Técnico (TechArticle)</option>
          <option value="Review">Reseña / Opinión de Producto o Servicio (Review)</option>
        </select>
      </div>

      <!-- Título del Artículo -->
      <div>
        <label for="artHeadline" class="block text-sm font-semibold text-slate-700 mb-1">Título del Contenido (headline)</label>
        <input type="text" id="artHeadline" name="artHeadline" required placeholder="Ej. Cómo optimizar tu web para IA en 2026" 
               class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm">
      </div>

      <div>
        <label for="artUrl" class="block text-sm font-semibold text-slate-700 mb-1">URL Canónica del Contenido (url / mainEntityOfPage)</label>
        <input type="url" id="artUrl" name="artUrl" required placeholder="https://tusitio.com/articulo"
               class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm">
      </div>

      <!-- URL de la Imagen de Portada -->
      <div>
        <label for="artImage" class="block text-sm font-semibold text-slate-700 mb-1">URL de Imagen de Portada (image)</label>
        <input type="url" id="artImage" name="artImage" required placeholder="https://tusitio.com/imagen-articulo.jpg" 
               class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm">
      </div>

      <!-- Fechas de Publicación y Modificación -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label for="artDatePub" class="block text-sm font-semibold text-slate-700 mb-1">Fecha de Publicación</label>
          <input type="date" id="artDatePub" name="artDatePub" required 
                 class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm">
        </div>
        <div>
          <label for="artDateMod" class="block text-sm font-semibold text-slate-700 mb-1">Última Modificación (Opcional)</label>
          <input type="date" id="artDateMod" name="artDateMod" 
                 class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm">
        </div>
      </div>

      <!-- Sección Condicional: Campos exclusivos para REVIEW (Oculta por defecto) -->
      <div id="reviewFields" class="hidden p-4 bg-purple-50 rounded-lg border border-purple-100 space-y-4">
        <h3 class="text-sm font-bold text-purple-900">Datos Específicos de la Reseña</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
  <label for="reviewItemType" class="block text-xs font-semibold text-purple-800 mb-1">Tipo de Elemento Reseñado</label>
  <select id="reviewItemType"
          class="w-full px-3 py-1.5 border border-purple-200 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-purple-500 text-sm cursor-pointer">
    <option value="Product">Producto</option>
    <option value="Service">Servicio</option>
    <option value="SoftwareApplication">Software / App</option>
    <option value="Course">Curso</option>
    <option value="Book">Libro</option>
    <option value="LocalBusiness">Negocio local</option>
    <option value="Thing">Otro</option>
  </select>
</div>
          <div>
            <label for="reviewItem" class="block text-xs font-semibold text-purple-800 mb-1">
              Nombre del Elemento Reseñado
            </label>
            <input type="text" id="reviewItem" placeholder="Ej. MacBook Pro M4" 
                   class="w-full px-3 py-1.5 border border-purple-200 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-purple-500 text-sm">
          </div>
          <div>
            <label for="reviewRating" class="block text-xs font-semibold text-purple-800 mb-1">Calificación (1 al 5)</label>
            <input type="number" id="reviewRating" min="1" max="5" step="0.1" placeholder="Ej. 4.8" 
                   class="w-full px-3 py-1.5 border border-purple-200 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-purple-500 text-sm">
          </div>
        </div>
      </div>

      <!-- Resumen / Descripción -->
      <div>
        <label for="artDescription" class="block text-sm font-semibold text-slate-700 mb-1">Resumen Corto (description)</label>
        <textarea id="artDescription" name="artDescription" rows="3" required placeholder="Un extracto de 2 o 3 líneas que resuma el contenido..." 
                  class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm"></textarea>
      </div>

      <div>
  <label for="artKeywords" class="block text-sm font-semibold text-slate-700 mb-1">Keywords / Temas separados por coma</label>
  <input type="text" id="artKeywords" name="artKeywords" placeholder="Ej. SEO, IA, Schema.org, Datos estructurados"
         class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm">
</div>

      <!-- Vinculación del Autor -->
      <div class="bg-amber-50 p-4 rounded-lg border border-amber-100">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="artAuthorName" class="block text-sm font-semibold text-amber-900 mb-1">Nombre del Autor</label>
            <input type="text" id="artAuthorName" name="artAuthorName" required placeholder="Ej. Juan Pérez" 
                   class="w-full px-4 py-2 border border-amber-200 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent text-sm">
          </div>
          <div>
            <label for="artAuthorUrl" class="block text-sm font-semibold text-amber-900 mb-1">URL de su Perfil Principal</label>
            <input type="url" id="artAuthorUrl" name="artAuthorUrl" required placeholder="https://tusitio.com" 
                   class="w-full px-4 py-2 border border-amber-200 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent text-sm">
          </div>
        </div>
      </div>

      <div class="bg-emerald-50 p-4 rounded-lg border border-emerald-100">
  <h3 class="text-sm font-bold text-emerald-900 mb-3">Publisher / Sitio Responsable</h3>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div>
      <label for="artPublisherName" class="block text-sm font-semibold text-emerald-900 mb-1">Nombre del Sitio o Marca</label>
      <input type="text" id="artPublisherName" name="artPublisherName" placeholder="Ej. Schema Panel"
             class="w-full px-4 py-2 border border-emerald-200 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm">
    </div>

    <div>
      <label for="artPublisherLogo" class="block text-sm font-semibold text-emerald-900 mb-1">URL del Logo</label>
      <input type="url" id="artPublisherLogo" name="artPublisherLogo" placeholder="https://tusitio.com/logo.png"
             class="w-full px-4 py-2 border border-emerald-200 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm">
    </div>
  </div>
</div>

      <!-- Botón de Envío -->
      <div class="pt-2">
        <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-lg transition-colors duration-200 text-sm cursor-pointer shadow-sm">
          Generar Schema Estructurado
        </button>
      </div>

    </form>
  </div>

  <!-- Modal Popup -->
  <div id="schemaModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-xs items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-2xl max-w-2xl w-full p-6 border border-slate-100 flex flex-col max-h-[85vh]">
      
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold text-slate-950">Código Schema.org Generado</h2>
        <button id="closeModal" class="text-slate-400 hover:text-slate-600 text-2xl font-semibold p-1 cursor-pointer">&times;</button>
      </div>

      <p class="text-xs text-slate-500 mb-3">Pegá este bloque de código dentro de la etiqueta <code class="bg-slate-100 px-1 py-0.5 rounded text-red-600">&lt;head&gt;</code> de tu página.</p>

      <textarea id="schemaOutput" readonly class="w-full flex-1 font-mono text-xs p-4 bg-slate-900 text-emerald-400 rounded-lg border border-slate-800 resize-none focus:outline-none min-h-[250px]"></textarea>

      <div class="mt-4 flex gap-3 justify-end">
        <button id="copySchema" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-5 rounded-lg transition-colors duration-200 text-sm cursor-pointer shadow-sm">
          Copiar Código
        </button>
      </div>

    </div>
  </div>

  <!-- Vinculación del script independiente -->
  <script src="art-main.js"></script>
</body>
</html>
