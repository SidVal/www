<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Breadcrumbs y Vinculación Jerárquica</title>
  <!-- Tailwind CSS v4 CDN -->
  <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-50 text-slate-800 p-6">

  <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-md p-8 border border-slate-100">
    <div class="mb-6">
      <h1 class="text-2xl font-bold text-slate-900">Configuración de Migajas de Pan (BreadcrumbList)</h1>
      <p class="text-sm text-slate-500 mt-1">Establece la jerarquía de la página actual y conéctala con la estructura del sitio.</p>
    </div>

    <!-- Formulario de Breadcrumbs -->
    <form id="breadcrumbForm" class="space-y-5">
      
      <!-- Nivel 1: Por defecto la Home del sitio -->
      <div class="p-4 bg-slate-100 rounded-lg border border-slate-200 space-y-3">
        <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Nivel 1 (Raíz del Sitio)</span>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Nombre Visual</label>
            <input type="text" id="rootName" required value="Inicio" 
                   class="w-full px-3 py-1.5 border border-slate-300 rounded-lg bg-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">URL Completa</label>
            <input type="url" id="rootUrl" required placeholder="https://tusitio.com" 
                   class="w-full px-3 py-1.5 border border-slate-300 rounded-lg bg-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>
      </div>

      <!-- Contenedor para niveles intermedios y finales -->
      <div id="crumbsContainer" class="space-y-4">
        
        <!-- Nivel 2 inicial (ej. la sección intermedia) -->
        <div class="crumb-item p-4 bg-slate-50 rounded-lg border border-slate-200 relative space-y-3">
          <div class="flex justify-between items-center">
            <span class="crumb-index text-xs font-bold text-slate-400 uppercase tracking-wider">Nivel 2</span>
            <button type="button" class="remove-crumb hidden text-red-500 hover:text-red-700 text-xs font-semibold cursor-pointer">Eliminar</button>
          </div>
          
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Nombre Visual (item.name)</label>
              <input type="text" required placeholder="Ej. Servicios" 
                     class="crumb-name w-full px-3 py-1.5 border border-slate-300 rounded-lg bg-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">URL Completa (item.@id)</label>
              <input type="url" required placeholder="https://tusitio.com" 
                     class="crumb-url w-full px-3 py-1.5 border border-slate-300 rounded-lg bg-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
          </div>
        </div>

      </div>

      <!-- Botones de Acción -->
      <div class="pt-2">
        <button type="button" id="addCrumbBtn" 
                class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2 px-4 rounded-lg transition-colors border border-slate-300 text-sm cursor-pointer shadow-xs">
          + Añadir nivel interno (Página hija)
        </button>
      </div>

      <div class="pt-4 border-t border-slate-100">
        <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-lg transition-colors duration-200 text-sm cursor-pointer shadow-sm">
          Generar Schema BreadcrumbList
        </button>
      </div>

    </form>
  </div>

  <!-- Modal Popup -->
  <div id="schemaModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-xs items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-2xl max-w-2xl w-full p-6 border border-slate-100 flex flex-col max-h-[85vh]">
      
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold text-slate-950">Código Schema.org BreadcrumbList</h2>
        <button id="closeModal" class="text-slate-400 hover:text-slate-600 text-2xl font-semibold p-1 cursor-pointer">&times;</button>
      </div>

      <p class="text-xs text-slate-500 mb-3">Inserta este bloque dentro del <code class="bg-slate-100 px-1 py-0.5 rounded text-red-600">&lt;head&gt;</code> de la página específica que estás estructurando.</p>

      <textarea id="schemaOutput" readonly class="w-full flex-1 font-mono text-xs p-4 bg-slate-900 text-emerald-400 rounded-lg border border-slate-800 resize-none focus:outline-none min-h-[220px]"></textarea>

      <div class="mt-4 flex gap-3 justify-end">
        <button id="copySchema" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-5 rounded-lg transition-colors duration-200 text-sm cursor-pointer shadow-sm">
          Copiar Código
        </button>
      </div>

    </div>
  </div>

  <!-- Script independiente para Breadcrumbs -->
  <script src="bread-main.js"></script>
</body>
</html>
