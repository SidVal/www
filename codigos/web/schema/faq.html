<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador Dinámico de Schema para FAQPage</title>
  <!-- Tailwind CSS v4 CDN -->
  <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-50 text-slate-800 p-6">

  <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-md p-8 border border-slate-100">
    <div class="mb-6">
      <h1 class="text-2xl font-bold text-slate-900">Configuración de FAQ (Schema.org)</h1>
      <p class="text-sm text-slate-500 mt-1">Añadí todas las preguntas frecuentes que tengas. Crucial para resolver objeciones antes de la compra.</p>
    </div>

    <!-- Formulario de FAQ -->
    <form id="faqForm" class="space-y-6">
      
      <!-- Contenedor dinámico de preguntas -->
      <div id="faqContainer" class="space-y-4">
        
        <!-- Bloque de pregunta inicial (Fijo como mínimo uno) -->
        <div class="faq-item p-4 bg-slate-50 rounded-lg border border-slate-200 relative space-y-3">
          <div class="flex justify-between items-center">
            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Pregunta 1</span>
            <!-- Botón para eliminar (oculto en el primero para que siempre quede al menos uno) -->
            <button type="button" class="remove-faq hidden text-red-500 hover:text-red-700 text-xs font-semibold cursor-pointer">Eliminar</button>
          </div>
          
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Pregunta (name)</label>
            <input type="text" required placeholder="Ej. ¿Qué incluye el servicio de consultoría mensual?" 
                   class="faq-question w-full px-4 py-2 border border-slate-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
          </div>
          
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Respuesta (acceptedAnswer)</label>
            <textarea required rows="2" placeholder="Ej. Incluye 4 sesiones virtuales de una hora, auditoría técnica semanal y soporte por Slack..." 
                      class="faq-answer w-full px-4 py-2 border border-slate-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"></textarea>
          </div>
        </div>

      </div>

      <!-- Botón para añadir más preguntas -->
      <div class="pt-2">
        <button type="button" id="addFaqBtn" 
                class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2 px-4 rounded-lg transition-colors border border-slate-300 text-sm cursor-pointer shadow-xs">
          + Añadir otra pregunta
        </button>
      </div>

      <!-- Botón de Envío Principal -->
      <div class="pt-4 border-t border-slate-100">
        <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-lg transition-colors duration-200 text-sm cursor-pointer shadow-sm">
          Generar Schema FAQPage
        </button>
      </div>

    </form>
  </div>

  <!-- Modal Popup -->
  <div id="schemaModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-xs items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-2xl max-w-2xl w-full p-6 border border-slate-100 flex flex-col max-h-[85vh]">
      
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold text-slate-950">Código Schema.org Generado</h2>
        <button id="closeModal" class="text-slate-400 hover:text-slate-600 text-2xl font-semibold p-1 cursor-pointer">&times;</button>
      </div>

      <p class="text-xs text-slate-500 mb-3">Inserta este bloque dentro del <code class="bg-slate-100 px-1 py-0.5 rounded text-red-600">&lt;head&gt;</code> de la página de preguntas frecuentes.</p>

      <textarea id="schemaOutput" readonly class="w-full flex-1 font-mono text-xs p-4 bg-slate-900 text-emerald-400 rounded-lg border border-slate-800 resize-none focus:outline-none min-h-[250px]"></textarea>

      <div class="mt-4 flex gap-3 justify-end">
        <button id="copySchema" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-5 rounded-lg transition-colors duration-200 text-sm cursor-pointer shadow-sm">
          Copiar Código
        </button>
      </div>

    </div>
  </div>

  <!-- Script independiente para FAQ -->
  <script src="faq-main.js"></script>
</body>
</html>
